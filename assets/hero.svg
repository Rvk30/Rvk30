<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 176" width="100%" height="176">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#58a6ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'SF Pro Display', sans-serif;
      font-weight: 700;
      letter-spacing: -0.4px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      font-weight: 400;
    }
    .mono-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes float-mascot {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .status-dot {
      animation: pulse-dot 2s ease-in-out infinite;
    }
    .mascot-group {
      animation: float-mascot 4s ease-in-out infinite;
    }
  </style>

  <!-- Base Card Frame -->
  <rect x="0.5" y="0.5" width="839" height="175" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  
  <!-- Subtle Top Edge Hairline Highlight -->
  <rect x="1" y="1" width="838" height="1.5" rx="1" fill="url(#topHighlight)"/>

  <!-- Status Indicator Badge -->
  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="102" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <circle cx="11" cy="10" r="3.5" fill="#3fb950" class="status-dot"/>
    <text x="21" y="13.5" fill="#7ee787" class="mono-text" font-size="9" font-weight="600" letter-spacing="1.2">AVAILABLE</text>
  </g>

  <!-- Developer Identity -->
  <!-- Name: Strongest visual element -->
  <text x="36" y="80" fill="#f0f6fc" font-size="28" class="name-text">Jyotirmoy Borah</text>

  <!-- Tagline / Subtitle -->
  <text x="36" y="106" fill="#8b949e" font-size="13.5" class="sub-text">CS student · developer</text>

  <!-- Bio / authentic philosophy -->
  <g transform="translate(36, 128)">
    <text x="0" y="0" fill="#7d8590" font-size="12" class="mono-text">
      <tspan fill="#58a6ff">&gt;</tspan> building things and figuring it out.
    </text>
  </g>

  <!-- Subtle Developer Easter Egg: Pixel Art Companion / Dragon Silhouette -->
  <!-- Clean, minimalist, restrained geometry on the right -->
  <g transform="translate(735, 52)">
    <g class="mascot-group" opacity="0.65">
      <!-- Mini Terminal / Pixel Dragon Mascot Frame -->
      <rect x="-8" y="-6" width="56" height="56" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <!-- 8-bit companion silhouette -->
    <g fill="url(#dragonGrad)">
      <!-- Horns / Crest -->
      <rect x="8" y="4" width="4" height="4"/>
      <rect x="28" y="4" width="4" height="4"/>
      <!-- Head -->
      <rect x="12" y="8" width="16" height="8" rx="1"/>
      <!-- Glowing Eye (Cyan) -->
      <rect x="22" y="10" width="3" height="3" fill="#79c0ff"/>
      <!-- Snout -->
      <rect x="24" y="14" width="6" height="4"/>
      <!-- Body -->
      <rect x="10" y="18" width="18" height="12" rx="1"/>
      <!-- Wings -->
      <rect x="4" y="16" width="6" height="6"/>
      <rect x="2" y="14" width="4" height="4"/>
      <!-- Tail -->
      <rect x="6" y="28" width="6" height="4"/>
      <rect x="2" y="26" width="4" height="4"/>
      <!-- Feet -->
      <rect x="10" y="30" width="4" height="4"/>
      <rect x="22" y="30" width="4" height="4"/>
    </g>
    <!-- Mascot Subtext -->
    <text x="20" y="44" text-anchor="middle" fill="#484f58" font-size="7.5" class="mono-text">COMPANION</text>
  </g>
  </g>

  <!-- Bottom Hairline Detail -->
  <line x1="36" y1="152" x2="804" y2="152" stroke="#21262d" stroke-width="0.7" stroke-dasharray="3 3"/>
</svg>
