<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#090b12" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a00" />
      <stop offset="50%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a00" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#3b1d3d" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff2a00" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyberpunk grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ff2a00" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#00f2fe" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .display { font-family: 'Orbitron', 'Eurostile', 'Segoe UI', sans-serif; font-weight: 900; }
    .sub { font-family: 'Orbitron', 'Eurostile', 'Segoe UI', sans-serif; font-weight: 700; letter-spacing: 4px; }
  </style>

  <!-- Background -->
  <rect width="900" height="260" rx="10" fill="url(#bgGrad)" />
  <rect width="900" height="260" rx="10" fill="url(#grid)" />
  <rect width="900" height="260" rx="10" fill="url(#dots)" />

  <!-- Cyberpunk Outer HUD Border -->
  <rect x="8" y="8" width="884" height="244" rx="8" fill="none" stroke="url(#hudBorder)" stroke-width="1.2" />
  
  <!-- Outer Corner Accents -->
  <path d="M 8 30 L 8 8 L 30 8" fill="none" stroke="#ff2a00" stroke-width="2.5" />
  <path d="M 892 30 L 892 8 L 870 8" fill="none" stroke="#ff2a00" stroke-width="2.5" />
  <path d="M 8 230 L 8 252 L 30 252" fill="none" stroke="#ff2a00" stroke-width="2.5" />
  <path d="M 892 230 L 892 252 L 870 252" fill="none" stroke="#ff2a00" stroke-width="2.5" />

  <!-- Top Status Bar -->
  <g transform="translate(25, 28)">
    <circle cx="4" cy="4" r="3" fill="#00ff66" filter="url(#glowCyan)" />
    <text x="14" y="7" fill="#00f2fe" font-size="9" class="mono" letter-spacing="2">SYS_STATUS: ONLINE</text>
    <text x="180" y="7" fill="#64748b" font-size="9" class="mono">|</text>
    <text x="195" y="7" fill="#ff7a00" font-size="9" class="mono" letter-spacing="2">FACTION: DARK DRAGON SYNDICATE</text>
    <text x="455" y="7" fill="#64748b" font-size="9" class="mono">|</text>
    <text x="470" y="7" fill="#94a3b8" font-size="9" class="mono" letter-spacing="1.5">NODE: ASIA-SOUTH-1 [IND]</text>
    <text x="750" y="7" fill="#ff2a00" font-size="9" class="mono" letter-spacing="2">CORE_V4.2</text>
  </g>

  <!-- Horizontal Tech Dividers -->
  <line x1="25" y1="42" x2="875" y2="42" stroke="#ff2a00" stroke-width="0.8" stroke-opacity="0.3" />
  <line x1="25" y1="44" x2="160" y2="44" stroke="#ff2a00" stroke-width="1.8" filter="url(#glowRed)" />
  <line x1="840" y1="44" x2="875" y2="44" stroke="#00f2fe" stroke-width="1.8" filter="url(#glowCyan)" />

  <!-- Dragon Head Insignia (Vector Cyber-Dragon Motif) on Right Side -->
  <g transform="translate(680, 52)" filter="url(#glowRed)">
    <!-- Dragon Horns & Crest -->
    <path d="M 80 20 L 125 -10 L 105 30 L 155 10 L 120 50 L 175 45 L 125 75 L 145 95 L 95 90 L 75 130 L 60 90 L 15 110 L 45 75 L -5 65 L 35 45 L 5 20 L 55 30 Z" 
          fill="#130914" stroke="url(#fireGrad)" stroke-width="1.8" />
    <!-- Dragon Brow & Eye -->
    <path d="M 45 65 L 85 55 L 75 75 Z" fill="#ff1a00" />
    <polygon points="65,65 85,60 75,70" fill="#00f2fe" filter="url(#glowCyan)" />
    <!-- Cybernetic Jaw & Fang -->
    <path d="M 75 90 L 110 105 L 100 115 L 70 100 L 50 120 L 45 98 Z" fill="#200a12" stroke="#ff7a00" stroke-width="1.2" />
    <!-- Cyber Circuits emanating from dragon -->
    <path d="M 120 50 L 160 50 L 175 65" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6" />
    <path d="M 35 45 L 5 45 L -10 30" fill="none" stroke="#ff2a00" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="175" cy="65" r="2" fill="#00f2fe" />
    <circle cx="-10" cy="30" r="2" fill="#ff2a00" />
  </g>

  <!-- Left Main Content Area -->
  <!-- Tagline Mini Badge -->
  <g transform="translate(35, 68)">
    <rect x="0" y="0" width="220" height="22" rx="3" fill="#ff2a00" fill-opacity="0.12" stroke="#ff2a00" stroke-width="1" />
    <text x="10" y="15" fill="#ff4d00" font-size="10" class="mono" font-weight="700" letter-spacing="2">⚡ SYSTEM ARCHITECT // RVK30</text>
  </g>

  <!-- Main Developer Name -->
  <text x="35" y="132" fill="#ffffff" font-size="44" class="display" letter-spacing="3">
    JYOTIRMOY BORAH
  </text>
  
  <!-- Glowing Underline Under Name -->
  <line x1="35" y1="144" x2="380" y2="144" stroke="url(#fireGrad)" stroke-width="2.5" filter="url(#glowRed)" />
  <circle cx="380" cy="144" r="3" fill="#ffb700" />

  <!-- Subtitle / Role -->
  <text x="35" y="174" fill="#00f2fe" font-size="14" class="sub" filter="url(#glowCyan)">
    FULL-STACK SYSTEMS ARCHITECT &amp; AUTOMATION SPECIALIST
  </text>

  <!-- Mission Statement Tagline -->
  <text x="35" y="200" fill="#94a3b8" font-size="12" class="mono" letter-spacing="1">
    Engineering high-throughput crawlers • Distributed backend systems • Cyberpunk UI
  </text>

  <!-- Bottom Tech Pills -->
  <g transform="translate(35, 218)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="85" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="8" y="14" fill="#38bdf8" font-size="10" class="mono">NEXT.JS 14/15</text>
    
    <!-- Pill 2 -->
    <rect x="95" y="0" width="85" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="103" y="14" fill="#60a5fa" font-size="10" class="mono">TYPESCRIPT</text>

    <!-- Pill 3 -->
    <rect x="190" y="0" width="90" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="198" y="14" fill="#4ade80" font-size="10" class="mono">PLAYWRIGHT</text>

    <!-- Pill 4 -->
    <rect x="290" y="0" width="85" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="298" y="14" fill="#a78bfa" font-size="10" class="mono">POSTGRESQL</text>

    <!-- Pill 5 -->
    <rect x="385" y="0" width="80" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="393" y="14" fill="#f43f5e" font-size="10" class="mono">DOCKER</text>
  </g>

  <!-- Cyber Coordinates & Telemetry Box in Center-Right -->
  <g transform="translate(520, 155)">
    <rect x="0" y="0" width="145" height="75" rx="4" fill="#0a0e17" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="15" y2="0" stroke="#00f2fe" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="15" stroke="#00f2fe" stroke-width="2" />
    <text x="10" y="18" fill="#64748b" font-size="8" class="mono">TELEMETRY MATRIX</text>
    <text x="10" y="34" fill="#ff7a00" font-size="9" class="mono">LVL 21 ARCHITECT</text>
    <text x="10" y="48" fill="#00f2fe" font-size="9" class="mono">XP // 99.4% PROD</text>
    <text x="10" y="63" fill="#94a3b8" font-size="8" class="mono">STATUS: DEPLOYING</text>
  </g>
</svg>
