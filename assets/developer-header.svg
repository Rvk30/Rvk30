<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#0f1118" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 700; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 500; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Container Card with subtle border -->
  <rect width="850" height="140" rx="10" fill="url(#headerBg)" stroke="#1e2330" stroke-width="1" />
  
  <!-- Subtle top accent line -->
  <rect x="0" y="0" width="850" height="2" rx="1" fill="url(#accentLine)" />

  <!-- Left Content Area -->
  <g transform="translate(36, 30)">
    <!-- Small Status Tag -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="3" fill="#10b981" />
      <text x="14" y="7" fill="#94a3b8" font-size="11" class="mono">building &amp; learning</text>
    </g>

    <!-- Name -->
    <text x="0" y="42" fill="#ffffff" font-size="28" class="title">
      JYOTIRMOY BORAH
    </text>

    <!-- Role / Student Status -->
    <text x="0" y="66" fill="#38bdf8" font-size="14" class="subtitle">
      Computer Science Student • Software Developer
    </text>

    <!-- Bio tagline -->
    <text x="0" y="88" fill="#64748b" font-size="12" class="mono">
      Building things, exploring systems, and figuring out how everything works.
    </text>
  </g>

  <!-- Right Subtle Gamer / Dragon Easter Egg Mark -->
  <g transform="translate(740, 38)" opacity="0.85">
    <!-- Minimalist geometric dragon crest -->
    <rect x="0" y="0" width="64" height="64" rx="8" fill="#131722" stroke="#252d3d" stroke-width="1" />
    <!-- Pixel dragon silhouette in subtle slate / cyan -->
    <path d="M 22 20 L 32 14 L 42 20 L 40 28 L 48 30 L 44 42 L 36 38 L 32 46 L 28 38 L 20 42 L 16 30 L 24 28 Z" fill="#38bdf8" opacity="0.9" />
    <circle cx="28" cy="24" r="1.5" fill="#090a0f" />
    <circle cx="36" cy="24" r="1.5" fill="#090a0f" />
    <text x="32" y="58" fill="#64748b" font-size="7" class="mono" text-anchor="middle">RVK30</text>
  </g>
</svg>
