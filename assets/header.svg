<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="100%" height="120">
  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 700; }
