<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="100%" height="30">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a00" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff2a00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="75%" stop-color="#ff2a00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff2a00" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Thin Cyber Rail -->
  <line x1="50" y1="15" x2="850" y2="15" stroke="url(#divGrad)" stroke-width="1.5" filter="url(#divGlow)" />
  
  <!-- Left Side Cyber Marks -->
  <polygon points="260,11 268,15 260,19" fill="#ff2a00" />
  <circle cx="280" cy="15" r="2" fill="#00f2fe" />
  
  <!-- Center Emblem -->
  <g transform="translate(450, 15)">
    <!-- Center Diamond -->
    <polygon points="0,-10 14,0 0,10 -14,0" fill="#0b0d14" stroke="#00f2fe" stroke-width="1.5" />
    <polygon points="0,-5 7,0 0,5 -7,0" fill="#ff2a00" filter="url(#divGlow)" />
    <!-- Wing Flairs -->
    <line x1="-30" y1="0" x2="-18" y2="0" stroke="#00f2fe" stroke-width="2" />
    <line x1="18" y1="0" x2="30" y2="0" stroke="#00f2fe" stroke-width="2" />
  </g>

  <!-- Right Side Cyber Marks -->
  <circle cx="620" cy="15" r="2" fill="#00f2fe" />
  <polygon points="640,11 632,15 640,19" fill="#ff2a00" />
</svg>
